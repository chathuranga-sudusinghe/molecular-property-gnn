[project]
name = "molecular-property-gnn"
version = "0.1.0"
description = "Reproducible molecular dataset validation and aqueous solubility audits"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pandas==2.2.3",
    "rdkit==2024.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
